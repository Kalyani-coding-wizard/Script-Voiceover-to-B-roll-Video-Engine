version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: app/Dockerfile
      target: api
    image: incubrix-broll-api:latest
    container_name: broll_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - artifact_cache:/workspace/outputs
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: app/Dockerfile
      target: worker
    image: incubrix-broll-worker:latest
    container_name: broll_worker
    command: python -m arq worker.main.WorkerSettings
    env_file: .env
    volumes:
      - artifact_cache:/workspace/outputs
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import arq; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: broll_postgres
    environment:
      POSTGRES_USER: broll
      POSTGRES_PASSWORD: broll
      POSTGRES_DB: broll
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broll -d broll"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: broll_redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  minio:
    image: adobe/s3mock:latest
    container_name: broll_minio
    environment:
      initialBuckets: broll-outputs
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  artifact_cache:
    driver: local
